# Fisher Iris without Setosa Current Results

DV-style Hyperblock test on Fisher Iris data without Setosa, 5-fold CV, n=100, t=0.95, m=2,4,5,8, forward, stratified sampling, seed=42

This experiment explores the influence of the m parameter on the minimum cases needed to converge.
Given 150 cases originally, 50 removed to create the modified dataset without Setosa.
100 cases over 5-fold CV gives 20 cases per fold so 80 cases for training and 20 cases for testing.
80 is divisible by 2, 4, 5, and 8 so m=2,4,5,8 are valid m parameter values that will not have a partial iteration.
Additional options to consider next are all the divisors of 80: 1, 2, 4, 5, 8, 10, 16, 20, 40, 80.

We can assume that when forwards processing by adding m cases each iteration that the min will always be a multiple of m.
Since the classes are balanced, and the m values are all divisors of the total number of training cases, the case-to-class distribution will always be equal between the two classes.

m=2
Summary: 70/100 converged;
mean 12.1 ± 13.7 cases;
min 2 (1 Versicolor, 1 Virginica);
max 62 (31 each class).
Data stored in results/bap_20260327_134114/

